<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strateji Sistemi</title>
<style>
:root{--bg:#0a1220;--card:#111c30;--card2:#182a47;--line:#233a5e;--tx:#e6eefb;--mut:#8da2c0;--acc:#3b82f6;--accfg:#ffffff;--ok:#22c55e;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef3fb;--card:#fff;--card2:#e3ecf9;--line:#cfdcf0;--tx:#0e1a2e;--mut:#55698a;--accfg:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fb;--card:#fff;--card2:#e3ecf9;--line:#cfdcf0;--tx:#0e1a2e;--mut:#55698a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 110px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.acc{color:var(--acc)}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.btn{width:100%;background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);margin-top:8px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
.tog{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none;cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--ok)}.tog.on::after{left:21px}
.match{border-left:3px solid var(--mut)}.match.w{border-left-color:var(--ok)}.match.l{border-left-color:var(--bad)}
.odd{background:var(--card2);border-radius:8px;padding:4px 9px;font-weight:700}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;background:var(--card2)}
.tag.w{color:var(--ok)}.tag.l{color:var(--bad)}
.rule{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.rule .row{margin-top:6px}.rule .row>*{flex:1}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px;flex:none!important}
.hint{background:var(--card2);border-radius:10px;padding:8px;font-size:12px;color:var(--mut);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:center;z-index:5}
nav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:56px}
nav button.on{color:var(--acc)}nav button i{font-style:normal;font-size:18px}
nav .plus{width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--accfg);font-size:28px;font-weight:700;margin-top:-18px;min-width:0;justify-content:center}
.bar{height:6px;border-radius:9px;background:var(--bad);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.live{color:var(--ok);font-weight:700;font-size:12px}
.sc{font-size:22px;font-weight:800;min-width:56px;text-align:center}
</style>
</head>

<nav id="nav"></nav>
